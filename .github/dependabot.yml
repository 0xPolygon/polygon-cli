version: 2

multi-ecosystem-groups:
  all-deps:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: gomod
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-deps

  - package-ecosystem: github-actions
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-deps
